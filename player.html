<!DOCTYPE html>
<html>
<head>
    <title>JioSaavn Stream Player</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            font-family: system-ui;
            box-sizing: border-box;
        }
        body {
            max-width: 700px;
            margin: 0 auto;
            padding: 1rem;
            background: #0a0a0a;
            color: #fff;
        }
        h1 {
            text-align: center;
            margin-bottom: 2rem;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
        }
        input {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 10px;
            background: #1a1a1a;
            color: #fff;
            outline: none;
        }
        input:focus {
            border-color: #1db954;
        }
        button {
            padding: 14px 24px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            background: #1db954;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            background: #1ed760;
        }
        .result-box {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 1rem;
            margin: 1rem 0;
            word-break: break-all;
            display: none;
        }
        .result-box.show {
            display: block;
        }
        .label {
            color: #888;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .url-text {
            color: #1db954;
            font-size: 13px;
            margin: 8px 0;
        }
        audio {
            width: 100%;
            margin: 1rem 0;
            border-radius: 10px;
        }
        .quality-btns {
            display: flex;
            gap: 8px;
            margin: 1rem 0;
            flex-wrap: wrap;
            align-items: center;
        }
        .quality-btns button {
            padding: 8px 16px;
            font-size: 14px;
            background: #333;
        }
        .quality-btns button.active {
            background: #1db954;
        }
        .copy-btn {
            padding: 6px 14px;
            font-size: 12px;
            background: #333;
            margin-left: 8px;
        }
        .error {
            color: #ff4444;
            margin: 1rem 0;
            display: none;
        }
        .song-card {
            display: flex;
            gap: 12px;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            align-items: center;
            margin: 4px 0;
            transition: background 0.2s;
        }
        .song-card:hover {
            background: #1a1a1a;
        }
        .song-card.active {
            background: #1a1a1a;
            border: 1px solid #1db954;
        }
        .song-card img {
            width: 50px;
            height: 50px;
            border-radius: 6px;
        }
        .song-info {
            flex: 1;
            min-width: 0;
        }
        .song-title {
            font-weight: 600;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .song-artist {
            margin: 2px 0;
            color: #888;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .now-playing {
            text-align: center;
            margin: 1rem 0;
        }
        .now-playing img {
            width: 200px;
            height: 200px;
            border-radius: 12px;
            margin-bottom: 1rem;
        }
        .now-playing .np-title {
            font-size: 20px;
            font-weight: 600;
            margin: 0;
        }
        .now-playing .np-artist {
            color: #888;
            margin: 4px 0;
        }
        .hidden {
            display: none;
        }
        .loading {
            text-align: center;
            color: #888;
            padding: 2rem;
        }
        .section-title {
            color: #888;
            font-size: 14px;
            margin: 1.5rem 0 0.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #222;
        }
        .download-btn {
            padding: 8px 16px;
            font-size: 14px;
            background: #333;
            text-decoration: none;
            color: #fff;
            border-radius: 10px;
            display: inline-block;
        }
        .download-btn:hover {
            background: #1db954;
        }
    </style>
</head>
<body>

<h1>🎵 JioSaavn Player</h1>

<!-- SEARCH -->
<div class="input-group">
    <input type="search" id="search" placeholder="Search for any song...">
    <button onclick="doSearch()">Search</button>
</div>
<div id="searchResults"></div>

<!-- NOW PLAYING -->
<div id="nowPlaying" class="now-playing hidden"></div>

<!-- PLAYER -->
<audio id="player" controls></audio>

<!-- QUALITY -->
<div class="quality-btns" id="qualityBtns">
    <span style="color:#888; line-height:35px;">Quality:</span>
    <button class="active" data-quality="320kbps">320</button>
    <button data-quality="160kbps">160</button>
    <button data-quality="96kbps">96</button>
    <button data-quality="48kbps">48</button>
</div>

<!-- MANUAL DECRYPT -->
<p class="section-title">Or paste encrypted_media_url manually:</p>
<div class="input-group">
    <input type="text" id="encryptedUrl" placeholder="Paste encrypted_media_url here...">
    <button onclick="manualDecrypt()">Decrypt</button>
</div>

<!-- RESULT -->
<div class="result-box" id="resultBox">
    <div class="label">Stream URL:</div>
    <div class="url-text" id="streamUrlText"></div>
    <button class="copy-btn" onclick="copyUrl()">📋 Copy</button>
    <a class="download-btn" id="downloadBtn" href="#" download style="margin-left:8px">⬇ Download</a>
</div>

<p class="error" id="error"></p>

<!-- CryptoJS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>

<script>
// ========== CONFIG ==========
const API_BASE = 'https://saavn.dev/api';
const DECRYPT_KEY = CryptoJS.enc.Utf8.parse('3834659127733675');

let currentQuality = '320kbps';
let currentSongUrls = {};
let allSongs = [];
let currentIndex = -1;

// ========== DECRYPT FUNCTION ==========
function decryptUrl(encryptedUrl) {
    try {
        const decrypted = CryptoJS.AES.decrypt(
            { ciphertext: CryptoJS.enc.Base64.parse(encryptedUrl) },
            DECRYPT_KEY,
            {
                mode: CryptoJS.mode.ECB,
                padding: CryptoJS.pad.Pkcs7
            }
        );
        const result = decrypted.toString(CryptoJS.enc.Utf8);
        if (!result) throw new Error('Empty');
        return result;
    } catch (e) {
        console.error('Decryption failed:', e);
        return null;
    }
}

// ========== SEARCH ==========
let searchTimeout;
document.getElementById('search').addEventListener('input', () => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(doSearch, 400);
});
document.getElementById('search').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doSearch();
});

async function doSearch() {
    const query = document.getElementById('search').value.trim();
    if (!query) return;

    const container = document.getElementById('searchResults');
    container.innerHTML = '<div class="loading">🔍 Searching...</div>';

    try {
        const res = await fetch(`${API_BASE}/search/songs?q=${encodeURIComponent(query)}&limit=15`);
        const data = await res.json();

        container.innerHTML = '';
        allSongs = [];

        if (!data.data || !data.data.results || data.data.results.length === 0) {
            container.innerHTML = '<div class="loading">No results found</div>';
            return;
        }

        data.data.results.forEach((song, index) => {
            allSongs.push(song);

            const card = document.createElement('div');
            card.className = 'song-card';
            card.id = `song-${index}`;
            card.innerHTML = `
                <img src="${song.image?.[1]?.url || song.image?.[0]?.url || ''}" alt="">
                <div class="song-info">
                    <p class="song-title">${song.name || 'Unknown'}</p>
                    <p class="song-artist">${song.artists?.primary?.map(a => a.name).join(', ') || song.primaryArtists || 'Unknown'}</p>
                </div>
            `;
            card.addEventListener('click', () => playSong(index));
            container.appendChild(card);
        });

    } catch (e) {
        console.error('Search failed:', e);
        container.innerHTML = '<div class="loading" style="color:#ff4444">Search failed. Try again.</div>';
    }
}

// ========== PLAY SONG ==========
function playSong(index) {
    const song = allSongs[index];
    if (!song) return;

    currentIndex = index;

    // Highlight active song
    document.querySelectorAll('.song-card').forEach(c => c.classList.remove('active'));
    const card = document.getElementById(`song-${index}`);
    if (card) card.classList.add('active');

    // Get download URLs from API response
    // saavn.dev API already returns decrypted URLs in downloadUrl array
    currentSongUrls = {};

    if (song.downloadUrl && song.downloadUrl.length > 0) {
        song.downloadUrl.forEach(item => {
            currentSongUrls[item.quality] = item.url;
        });
    }

    // Get the URL for current quality
    let streamUrl = currentSongUrls[currentQuality]
        || currentSongUrls['320kbps']
        || currentSongUrls['160kbps']
        || currentSongUrls['96kbps']
        || (song.downloadUrl && song.downloadUrl.length > 0 ? song.downloadUrl.at(-1).url : null);

    if (!streamUrl) {
        showError('No stream URL available for this song');
        return;
    }

    // Show now playing
    const artistName = song.artists?.primary?.map(a => a.name).join(', ') || song.primaryArtists || 'Unknown';
    const imageUrl = song.image?.[2]?.url || song.image?.[1]?.url || '';

    showNowPlaying(song.name, artistName, imageUrl);

    // Show URL
    document.getElementById('streamUrlText').textContent = streamUrl;
    document.getElementById('resultBox').classList.add('show');
    document.getElementById('downloadBtn').href = streamUrl;
    document.getElementById('error').style.display = 'none';

    // Play
    const player = document.getElementById('player');
    player.src = streamUrl;
    player.play();
}

// ========== MANUAL DECRYPT ==========
function manualDecrypt() {
    const encrypted = document.getElementById('encryptedUrl').value.trim();
    if (!encrypted) {
        showError('Please paste an encrypted_media_url');
        return;
    }

    const decrypted = decryptUrl(encrypted);
    if (!decrypted) {
        showError('Decryption failed. Make sure you pasted the correct encrypted_media_url');
        return;
    }

    // Build quality URLs
    currentSongUrls = {};
    ['320', '160', '96', '48'].forEach(q => {
        currentSongUrls[q + 'kbps'] = decrypted.replace(/_\d+\.mp4/, `_${q}.mp4`).replace(/_\d+\.m4a/, `_${q}.m4a`);
    });

    const streamUrl = currentSongUrls[currentQuality] || decrypted;

    document.getElementById('streamUrlText').textContent = streamUrl;
    document.getElementById('resultBox').classList.add('show');
    document.getElementById('downloadBtn').href = streamUrl;
    document.getElementById('error').style.display = 'none';

    showNowPlaying('Manual Track', 'From encrypted URL', '');

    const player = document.getElementById('player');
    player.src = streamUrl;
    player.play();
}

// ========== QUALITY SWITCH ==========
document.querySelectorAll('.quality-btns button').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.quality-btns button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentQuality = btn.dataset.quality;

        const url = currentSongUrls[currentQuality];
        if (url) {
            const player = document.getElementById('player');
            const currentTime = player.currentTime;
            const wasPlaying = !player.paused;

            player.src = url;
            player.currentTime = currentTime;
            if (wasPlaying) player.play();

            document.getElementById('streamUrlText').textContent = url;
            document.getElementById('downloadBtn').href = url;
        }
    });
});

// ========== AUTO PLAY NEXT ==========
document.getElementById('player').addEventListener('ended', () => {
    if (currentIndex >= 0 && currentIndex < allSongs.length - 1) {
        playSong(currentIndex + 1);
    }
});

// ========== UI HELPERS ==========
function showNowPlaying(title, artist, image) {
    const np = document.getElementById('nowPlaying');
    np.classList.remove('hidden');
    np.innerHTML = `
        ${image ? `<img src="${image}" alt="">` : ''}
        <p class="np-title">${title || 'Unknown'}</p>
        <p class="np-artist">${artist || 'Unknown'}</p>
    `;
}

function showError(msg) {
    const el = document.getElementById('error');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('resultBox').classList.remove('show');
}

function copyUrl() {
    const url = document.getElementById('streamUrlText').textContent;
    navigator.clipboard.writeText(url).then(() => {
        const btn = document.querySelector('.copy-btn');
        btn.textContent = '✅ Copied!';
        setTimeout(() => btn.textContent = '📋 Copy', 2000);
    });
}
</script>

</body>
</html>
