<!DOCTYPE html>
<html>
<head>
    <title>JioSaavn URL Decryptor & Player</title>
    <meta charset="UTF-8">
    <style>
        * {
            font-family: system-ui;
            box-sizing: border-box;
        }
        body {
            max-width: 700px;
            margin: 2rem auto;
            padding: 0 1rem;
            background: #0a0a0a;
            color: #fff;
        }
        h1 {
            text-align: center;
            margin-bottom: 2rem;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
        }
        input {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 10px;
            background: #1a1a1a;
            color: #fff;
            outline: none;
        }
        input:focus {
            border-color: #1db954;
        }
        button {
            padding: 14px 24px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            background: #1db954;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            background: #1ed760;
        }
        .result {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 1rem;
            margin: 1rem 0;
            word-break: break-all;
            display: none;
        }
        .result.show {
            display: block;
        }
        .label {
            color: #888;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .url {
            color: #1db954;
            font-size: 14px;
            margin: 8px 0;
        }
        audio {
            width: 100%;
            margin: 1rem 0;
            border-radius: 10px;
        }
        .quality-btns {
            display: flex;
            gap: 8px;
            margin: 1rem 0;
            flex-wrap: wrap;
        }
        .quality-btns button {
            padding: 8px 16px;
            font-size: 14px;
            background: #333;
        }
        .quality-btns button.active {
            background: #1db954;
        }
        .quality-btns button:hover {
            background: #1ed760;
        }
        .copy-btn {
            padding: 6px 14px;
            font-size: 12px;
            background: #333;
            margin-left: 8px;
        }
        .error {
            color: #ff4444;
            margin: 1rem 0;
            display: none;
        }
        .search-section {
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid #333;
        }
        .song-card {
            display: flex;
            gap: 12px;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            align-items: center;
            margin: 4px 0;
        }
        .song-card:hover {
            background: #1a1a1a;
        }
        .song-card img {
            width: 50px;
            height: 50px;
            border-radius: 6px;
        }
        .song-info {
            flex: 1;
        }
        .song-title {
            font-weight: 600;
            margin: 0;
        }
        .song-artist {
            margin: 2px 0;
            color: #888;
            font-size: 14px;
        }
        .now-playing {
            text-align: center;
            margin: 1rem 0;
        }
        .now-playing img {
            width: 200px;
            height: 200px;
            border-radius: 12px;
            margin-bottom: 1rem;
        }
        .now-playing .song-title {
            font-size: 20px;
        }
        .now-playing .song-artist {
            color: #888;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<h1>🎵 JioSaavn Decryptor & Player</h1>

<!-- SEARCH SECTION -->
<div class="search-section">
    <div class="input-group">
        <input type="search" id="search" placeholder="Search for any song...">
        <button onclick="doSearch()">Search</button>
    </div>
    <div id="searchResults"></div>
</div>

<!-- NOW PLAYING -->
<div id="nowPlaying" class="now-playing hidden"></div>

<!-- MANUAL DECRYPT SECTION -->
<h3>Or paste encrypted_media_url manually:</h3>
<div class="input-group">
    <input type="text" id="encryptedUrl" placeholder="Paste encrypted_media_url here...">
    <button onclick="decryptAndPlay()">Decrypt & Play</button>
</div>

<!-- QUALITY SELECTOR -->
<div class="quality-btns" id="qualityBtns">
    <span style="color:#888; line-height:35px;">Quality:</span>
    <button class="active" data-quality="320">320kbps</button>
    <button data-quality="160">160kbps</button>
    <button data-quality="96">96kbps</button>
    <button data-quality="48">48kbps</button>
</div>

<!-- RESULT -->
<div class="result" id="result">
    <div class="label">Decrypted Stream URL:</div>
    <div class="url" id="decryptedUrl"></div>
    <button class="copy-btn" onclick="copyUrl()">📋 Copy URL</button>
</div>

<p class="error" id="error"></p>

<!-- AUDIO PLAYER -->
<audio id="player" controls></audio>

<!-- CryptoJS Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>

<script>
// ===== THE SECRET KEY =====
// This is JioSaavn's AES-128-ECB decryption key
// It has never changed since 2018
const JIOSAAVN_KEY = '38346591';

// Full key string
const KEY_STRING = '38346591';
const FULL_KEY = CryptoJS.enc.Utf8.parse('38346591');

// Wait... the actual full key is 16 bytes
const DECRYPT_KEY = CryptoJS.enc.Utf8.parse('3834659127733675');

let currentQuality = '320';
let currentDecryptedBaseUrl = '';

// ===== DECRYPTION FUNCTION =====
function decryptUrl(encryptedUrl) {
    try {
        // The encrypted URL is base64 encoded AES-128-ECB encrypted text
        const decrypted = CryptoJS.AES.decrypt(
            { ciphertext: CryptoJS.enc.Base64.parse(encryptedUrl) },
            DECRYPT_KEY,
            {
                mode: CryptoJS.mode.ECB,
                padding: CryptoJS.pad.Pkcs7
            }
        );

        const decryptedText = decrypted.toString(CryptoJS.enc.Utf8);

        if (!decryptedText) {
            throw new Error('Decryption returned empty string');
        }

        return decryptedText;

    } catch (e) {
        console.error('Decryption failed:', e);
        return null;
    }
}

// ===== REPLACE QUALITY IN URL =====
function getQualityUrl(baseUrl, quality) {
    // URL format: https://aac.saavncdn.com/665/xxxxx_320.mp4
    // Replace _320 with desired quality
    return baseUrl.replace(/_\d+\.mp4/, `_${quality}.mp4`)
                  .replace(/_\d+\.m4a/, `_${quality}.m4a`);
}

// ===== DECRYPT AND PLAY (Manual) =====
function decryptAndPlay() {
    const encrypted = document.getElementById('encryptedUrl').value.trim();
    const error = document.getElementById('error');
    const result = document.getElementById('result');

    if (!encrypted) {
        error.textContent = 'Please paste an encrypted_media_url';
        error.style.display = 'block';
        return;
    }

    error.style.display = 'none';

    const decrypted = decryptUrl(encrypted);

    if (!decrypted) {
        error.textContent = 'Decryption failed. Make sure you pasted the correct encrypted_media_url';
        error.style.display = 'block';
        result.classList.remove('show');
        return;
    }

    currentDecryptedBaseUrl = decrypted;
    const finalUrl = getQualityUrl(decrypted, currentQuality);

    document.getElementById('decryptedUrl').textContent = finalUrl;
    result.classList.add('show');

    // Play it
    const player = document.getElementById('player');
    player.src = finalUrl;
    player.play();
}

// ===== QUALITY BUTTONS =====
document.querySelectorAll('.quality-btns button').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.quality-btns button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentQuality = btn.dataset.quality;

        if (currentDecryptedBaseUrl) {
            const finalUrl = getQualityUrl(currentDecryptedBaseUrl, currentQuality);
            document.getElementById('decryptedUrl').textContent = finalUrl;
            document.getElementById('player').src = finalUrl;
            document.getElementById('player').play();
        }
    });
});

// ===== COPY URL =====
function copyUrl() {
    const url = document.getElementById('decryptedUrl').textContent;
    navigator.clipboard.writeText(url);
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '✅ Copied!';
    setTimeout(() => btn.textContent = '📋 Copy URL', 2000);
}

// ===== SEARCH =====
let searchTimeout;
document.getElementById('search').addEventListener('input', () => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(doSearch, 400);
});

document.getElementById('search').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doSearch();
});

async function doSearch() {
    const query = document.getElementById('search').value.trim();
    if (!query) return;

    const container = document.getElementById('searchResults');
    container.innerHTML = '<p style="color:#888">Searching...</p>';

    try {
        // Use JioSaavn's internal API directly
        const res = await fetch(`https://www.jiosaavn.com/api.php?__call=autocomplete.get&query=${encodeURIComponent(query)}&_format=json&_marker=0&ctx=web6dot0`);
        const data = await res.json();

        container.innerHTML = '';

        if (data.songs && data.songs.data) {
            data.songs.data.forEach(song => {
                const card = document.createElement('div');
                card.className = 'song-card';
                card.innerHTML = `
                    <img src="${song.image.replace('150x150', '50x50')}" alt="">
                    <div class="song-info">
                        <p class="song-title">${song.title}</p>
                        <p class="song-artist">${song.more_info?.singers || song.description || ''}</p>
                    </div>
                `;
                card.addEventListener('click', () => loadSong(song.id));
                container.appendChild(card);
            });
        }

        if (!data.songs || !data.songs.data || data.songs.data.length === 0) {
            container.innerHTML = '<p style="color:#888">No results found</p>';
        }

    } catch (e) {
        // Fallback to saavn.dev API
        try {
            const res = await fetch(`https://saavn.dev/api/search/songs?q=${encodeURIComponent(query)}&limit=10`);
            const data = await res.json();
            container.innerHTML = '';

            if (data.data && data.data.results) {
                data.data.results.forEach(song => {
                    const card = document.createElement('div');
                    card.className = 'song-card';
                    card.innerHTML = `
                        <img src="${song.image[1]?.url || ''}" alt="">
                        <div class="song-info">
                            <p class="song-title">${song.name}</p>
                            <p class="song-artist">${song.primaryArtists}</p>
                        </div>
                    `;
                    card.addEventListener('click', () => {
                        // Already has download URLs
                        const streamUrl = song.downloadUrl.at(-1).url;
                        showNowPlaying(song.name, song.primaryArtists, song.image[2]?.url);
                        document.getElementById('player').src = streamUrl;
                        document.getElementById('player').play();
                        document.getElementById('decryptedUrl').textContent = streamUrl;
                        document.getElementById('result').classList.add('show');
                    });
                    container.appendChild(card);
                });
            }
        } catch (e2) {
            container.innerHTML = '<p style="color:#ff4444">Search failed. Try again.</p>';
        }
    }
}

// ===== LOAD SONG BY ID =====
async function loadSong(songId) {
    try {
        const res = await fetch(`https://www.jiosaavn.com/api.php?__call=song.getDetails&pids=${songId}&_format=json&_marker=0`);
        const data = await res.json();

        const song = data[songId] || Object.values(data)[0];

        if (!song || !song.encrypted_media_url) {
            alert('Could not load song');
            return;
        }

        // Decrypt the URL locally
        const decrypted = decryptUrl(song.encrypted_media_url);

        if (!decrypted) {
            alert('Decryption failed');
            return;
        }

        currentDecryptedBaseUrl = decrypted;
        const finalUrl = getQualityUrl(decrypted, currentQuality);

        // Show now playing
        showNowPlaying(song.song, song.primary_artists, song.image?.replace('150x150', '500x500'));

        // Show decrypted URL
        document.getElementById('decryptedUrl').textContent = finalUrl;
        document.getElementById('result').classList.add('show');
        document.getElementById('encryptedUrl').value = song.encrypted_media_url;

        // Play
        const player = document.getElementById('player');
        player.src = finalUrl;
        player.play();

    } catch (e) {
        console.error(e);
        alert('Failed to load song. Try again.');
    }
}

// ===== NOW PLAYING UI =====
function showNowPlaying(title, artist, image) {
    const np = document.getElementById('nowPlaying');
    np.classList.remove('hidden');
    np.innerHTML = `
        ${image ? `<img src="${image}" alt="">` : ''}
        <p class="song-title">${title || 'Unknown'}</p>
        <p class="song-artist">${artist || 'Unknown'}</p>
    `;
}
</script>

</body>
</html>
