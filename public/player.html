<!DOCTYPE html>
<html>
<head>
    <title>JioSaavn Player</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg: #0a0a0a;
            --card: #141414;
            --card-hover: #1a1a1a;
            --border: #222;
            --text: #fff;
            --text-dim: #888;
            --text-dimmer: #555;
            --accent: #1db954;
            --accent-hover: #1ed760;
        }
        * {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .app {
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem;
            padding-bottom: 260px;
        }
        .header {
            text-align: center;
            padding: 1.5rem 0;
        }
        .logo {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), #15e065);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .tagline {
            color: var(--text-dimmer);
            font-size: 13px;
            margin-top: 4px;
        }
        .search-wrapper {
            position: sticky;
            top: 0;
            background: var(--bg);
            padding: 12px 0;
            z-index: 100;
        }
        .search-bar {
            display: flex;
            gap: 10px;
        }
        .search-bar input {
            flex: 1;
            padding: 14px 20px;
            font-size: 16px;
            border: 2px solid var(--border);
            border-radius: 50px;
            background: var(--card);
            color: var(--text);
            outline: none;
            transition: border-color 0.3s;
        }
        .search-bar input:focus { border-color: var(--accent); }
        .search-bar input::placeholder { color: var(--text-dimmer); }
        .tabs {
            display: flex;
            gap: 8px;
            margin: 1rem 0;
            overflow-x: auto;
        }
        .tab {
            padding: 8px 18px;
            font-size: 14px;
            border: none;
            border-radius: 50px;
            background: var(--card);
            color: var(--text-dim);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .tab:hover { background: var(--card-hover); }
        .tab.active { background: var(--accent); color: #000; font-weight: 600; }
        .song-list { display: flex; flex-direction: column; gap: 2px; }
        .song-item {
            display: flex;
            gap: 14px;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            align-items: center;
            transition: background 0.2s;
            position: relative;
        }
        .song-item:hover { background: var(--card-hover); }
        .song-item.active { background: var(--card); }
        .song-item.loading::after {
            content: '';
            position: absolute;
            right: 14px;
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        .song-num {
            width: 24px;
            text-align: center;
            color: var(--text-dimmer);
            font-size: 14px;
            flex-shrink: 0;
        }
        .song-item:hover .song-num, .song-item.active .song-num { color: var(--accent); }
        .song-thumb {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .song-meta { flex: 1; min-width: 0; }
        .song-name {
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .song-item.active .song-name { color: var(--accent); }
        .song-artists {
            color: var(--text-dim);
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        .song-dur {
            color: var(--text-dimmer);
            font-size: 13px;
            flex-shrink: 0;
            min-width: 40px;
            text-align: right;
        }

        /* Queue Panel */
        .queue-panel {
            display: none;
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            width: 350px;
            max-width: 90vw;
            background: #141414;
            border-left: 1px solid var(--border);
            z-index: 1500;
            overflow-y: auto;
            padding: 1rem;
            padding-bottom: 220px;
            transition: transform 0.3s ease;
        }
        .queue-panel.show { display: block; }
        .queue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            position: sticky;
            top: 0;
            background: #141414;
            padding: 0.5rem 0;
            z-index: 10;
        }
        .queue-header h3 { font-size: 18px; }
        .queue-close {
            background: #333;
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
        }
        .queue-section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dimmer);
            margin: 1rem 0 0.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }
        .queue-item {
            display: flex;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            align-items: center;
            transition: background 0.2s;
        }
        .queue-item:hover { background: var(--card-hover); }
        .queue-item.active { background: #1db95415; }
        .queue-item.active .qi-name { color: var(--accent); }
        .queue-item img {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            object-fit: cover;
        }
        .qi-meta { flex: 1; min-width: 0; }
        .qi-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .qi-artist {
            font-size: 11px;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .qi-remove {
            background: none;
            border: none;
            color: var(--text-dimmer);
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .queue-item:hover .qi-remove { opacity: 1; }
        .qi-remove:hover { color: #ff4444; }
        .queue-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 1rem;
        }
        .queue-action-btn {
            flex: 1;
            padding: 8px;
            font-size: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.2s;
        }
        .queue-action-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* Suggestions Section */
        .suggestions-section {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            display: none;
        }
        .suggestions-section.show { display: block; }
        .suggestions-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .suggestions-header h3 { font-size: 18px; font-weight: 700; }
        .small-btn {
            padding: 6px 14px;
            font-size: 12px;
            border: 1px solid #333;
            border-radius: 50px;
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.2s;
        }
        .small-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* Player Bar */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #181818;
            border-top: 1px solid #282828;
            z-index: 1000;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        .player-bar.show { transform: translateY(0); }
        .player-wrapper {
            max-width: 800px;
            margin: 0 auto;
            padding: 10px 1rem 8px;
        }
        .player-top {
            display: flex;
            gap: 14px;
            align-items: center;
            margin-bottom: 8px;
        }
        .player-img {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            object-fit: cover;
        }
        .player-meta { flex: 1; min-width: 0; }
        .player-title {
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-artist {
            color: var(--text-dim);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 6px;
        }
        .ctrl-btn {
            background: none;
            border: none;
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: all 0.2s;
            opacity: 0.8;
        }
        .ctrl-btn:hover { opacity: 1; }
        .ctrl-btn.main {
            background: var(--accent);
            color: #000;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            opacity: 1;
        }
        .ctrl-btn.main:hover { background: var(--accent-hover); transform: scale(1.05); }
        .ctrl-btn.active-mode { color: var(--accent); opacity: 1; }
        .progress-row { display: flex; align-items: center; gap: 8px; }
        .time-label {
            font-size: 11px;
            color: var(--text-dimmer);
            min-width: 38px;
            font-variant-numeric: tabular-nums;
        }
        .time-label:last-child { text-align: right; }
        .seek-bar {
            flex: 1;
            height: 4px;
            background: #333;
            border-radius: 3px;
            cursor: pointer;
            transition: height 0.1s;
        }
        .seek-bar:hover { height: 6px; }
        .seek-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            width: 0%;
            pointer-events: none;
        }
        .quality-row {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .q-btn {
            padding: 3px 10px;
            font-size: 11px;
            border: 1px solid #333;
            border-radius: 50px;
            background: transparent;
            color: var(--text-dimmer);
            cursor: pointer;
            transition: all 0.2s;
        }
        .q-btn.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
        .q-btn:hover { border-color: var(--accent); color: var(--accent); }
        .q-btn.active:hover { color: #000; }
        .action-link {
            padding: 3px 10px;
            font-size: 11px;
            border: 1px solid #333;
            border-radius: 50px;
            color: var(--text-dimmer);
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .action-link:hover { border-color: var(--accent); color: var(--accent); }

        /* Lyrics Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 2000;
            overflow-y: auto;
            padding: 2rem 1rem;
        }
        .modal-overlay.show { display: block; }
        .modal-box { max-width: 550px; margin: 0 auto; text-align: center; }
        .modal-box h2 { color: var(--accent); margin-bottom: 0.5rem; }
        .modal-box .sub { color: var(--text-dim); font-size: 14px; margin-bottom: 1.5rem; }
        .modal-lyrics { white-space: pre-wrap; line-height: 2; font-size: 16px; color: #ccc; }
        .modal-close {
            position: fixed;
            top: 1rem;
            right: 1rem;
            font-size: 22px;
            background: #333;
            border: none;
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
        }

        .status { text-align: center; padding: 3rem 1rem; color: var(--text-dimmer); }
        .status.error { color: #ff4444; }
        .section-title { font-size: 22px; font-weight: 700; margin: 1.5rem 0 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #333;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <div class="logo">🎵 JioSaavn Player</div>
        <div class="tagline">Self-hosted streaming • Queue • Auto suggestions</div>
    </div>

    <div class="search-wrapper">
        <div class="search-bar">
            <input type="search" id="searchInput" placeholder="What do you want to listen to?">
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" data-lang="">All</button>
        <button class="tab" data-lang="hindi">Hindi</button>
        <button class="tab" data-lang="english">English</button>
        <button class="tab" data-lang="punjabi">Punjabi</button>
        <button class="tab" data-lang="tamil">Tamil</button>
        <button class="tab" data-lang="telugu">Telugu</button>
    </div>

    <div id="content">
        <div class="status">Search for a song to get started</div>
    </div>

    <!-- Suggestions -->
    <div class="suggestions-section" id="suggestionsSection">
        <div class="suggestions-header">
            <h3>🎯 Up Next — You might also like</h3>
            <div>
                <button class="small-btn" onclick="addAllSuggestionsToQueue()">+ Add all to queue</button>
                <button class="small-btn" onclick="loadSuggestions()" style="margin-left:4px">🔄</button>
            </div>
        </div>
        <div class="song-list" id="suggestionsList"></div>
    </div>
</div>

<!-- Queue Panel -->
<div class="queue-panel" id="queuePanel">
    <div class="queue-header">
        <h3>Queue</h3>
        <button class="queue-close" onclick="toggleQueue()">✕</button>
    </div>
    <div class="queue-actions">
        <button class="queue-action-btn" onclick="clearQueue()">🗑 Clear</button>
        <button class="queue-action-btn" onclick="shuffleQueue()">🔀 Shuffle</button>
    </div>

    <div id="queueNowPlaying"></div>
    <div id="queueNextUp"></div>
    <div id="queueHistory"></div>
</div>

<!-- Player Bar -->
<div class="player-bar" id="playerBar">
    <div class="player-wrapper">
        <div class="player-top">
            <img class="player-img" id="pImg" src="" alt="">
            <div class="player-meta">
                <div class="player-title" id="pTitle">—</div>
                <div class="player-artist" id="pArtist">—</div>
            </div>
        </div>
        <div class="controls">
            <button class="ctrl-btn" id="shuffleBtn" onclick="toggleShuffle()" title="Shuffle">🔀</button>
            <button class="ctrl-btn" onclick="prevSong()">⏮</button>
            <button class="ctrl-btn main" id="playBtn" onclick="togglePlay()">▶</button>
            <button class="ctrl-btn" onclick="nextSong()">⏭</button>
            <button class="ctrl-btn" id="repeatBtn" onclick="toggleRepeat()" title="Repeat">🔁</button>
            <button class="ctrl-btn" onclick="toggleQueue()" title="Queue">📋</button>
        </div>
        <div class="progress-row">
            <span class="time-label" id="curTime">0:00</span>
            <div class="seek-bar" id="seekBar">
                <div class="seek-fill" id="seekFill"></div>
            </div>
            <span class="time-label" id="durTime">0:00</span>
        </div>
        <div class="quality-row">
            <button class="q-btn" data-q="12kbps">12k</button>
            <button class="q-btn" data-q="48kbps">48k</button>
            <button class="q-btn" data-q="96kbps">96k</button>
            <button class="q-btn" data-q="160kbps">160k</button>
            <button class="q-btn active" data-q="320kbps">320k</button>
            <span class="action-link" id="lyricsLink" onclick="openLyrics()" style="display:none">📝 Lyrics</span>
            <span class="action-link" onclick="copyUrl()">📋 Copy</span>
            <a class="action-link" id="dlLink" href="#" download>⬇ DL</a>
        </div>
    </div>
</div>

<!-- Lyrics Modal -->
<div class="modal-overlay" id="lyricsModal">
    <button class="modal-close" onclick="closeLyrics()">✕</button>
    <div class="modal-box">
        <h2 id="lyricTitle"></h2>
        <p class="sub" id="lyricArtist"></p>
        <div class="modal-lyrics" id="lyricText"></div>
    </div>
</div>

<audio id="audio"></audio>

<script>
const API = window.location.origin + '/api';
const audio = document.getElementById('audio');

// ===== STATE =====
let songs = [];
let currentIndex = -1;
let currentQuality = '320kbps';
let currentUrls = {};
let currentSongData = null;
let selectedLang = '';

// Queue
let queue = [];           // upcoming songs
let history = [];         // played songs
let suggestedSongs = [];
let playedIds = [];       // all played song IDs for session suggestions

// Modes
let shuffleMode = false;
let repeatMode = 'none';  // none, one, all

// Suggestion prefetch
let suggestionsLoading = false;
let suggestionsPreloaded = false;

// ===== SEARCH =====
const searchInput = document.getElementById('searchInput');
let searchTimer;
searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(doSearch, 350);
});
searchInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { clearTimeout(searchTimer); doSearch(); }
});

document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        selectedLang = tab.dataset.lang;
        if (searchInput.value.trim()) doSearch();
    });
});

async function doSearch() {
    const q = searchInput.value.trim();
    if (!q) return;

    const content = document.getElementById('content');
    content.innerHTML = '<div class="status"><span class="spinner"></span>Searching...</div>';

    try {
        const res = await fetch(`${API}/search?q=${encodeURIComponent(q)}&limit=30`);
        const data = await res.json();

        if (!data.success || !data.results?.length) {
            content.innerHTML = '<div class="status">No results found</div>';
            return;
        }

        let results = data.results;
        if (selectedLang) {
            const filtered = results.filter(s => s.language === selectedLang);
            if (filtered.length > 0) results = filtered;
        }

        songs = results;
        renderSongs();
    } catch (e) {
        console.error(e);
        content.innerHTML = '<div class="status error">Search failed</div>';
    }
}

function renderSongs() {
    const content = document.getElementById('content');
    content.innerHTML = '<div class="section-title">Results</div><div class="song-list" id="songList"></div>';
    const list = document.getElementById('songList');

    songs.forEach((song, i) => {
        list.appendChild(createSongElement(song, i, 's', () => playSongFromSearch(i)));
    });
}

function createSongElement(song, index, prefix, onClick) {
    const el = document.createElement('div');
    el.className = 'song-item';
    el.id = `${prefix}-${index}`;

    const artistText = getArtistText(song.artists);
    const imageUrl = getImageUrl(song.image, 'low');
    const dur = formatTime(song.duration || 0);

    el.innerHTML = `
        <div class="song-num">${index + 1}</div>
        <img class="song-thumb" src="${imageUrl}" alt="" loading="lazy">
        <div class="song-meta">
            <div class="song-name">${song.name || 'Unknown'}</div>
            <div class="song-artists">${artistText}</div>
        </div>
        <div class="song-dur">${dur}</div>
    `;

    el.addEventListener('click', onClick);
    return el;
}

// ===== PLAY FROM SEARCH =====
async function playSongFromSearch(index) {
    const song = songs[index];
    if (!song) return;

    currentIndex = index;

    // Add remaining search songs to queue
    queue = songs.slice(index + 1).map(s => ({ ...s, source: 'search' }));

    await fetchAndPlay(song);
}

// ===== PLAY FROM SUGGESTION =====
async function playSuggestion(index) {
    const song = suggestedSongs[index];
    if (!song) return;

    // Add remaining suggestions to queue
    queue = suggestedSongs.slice(index + 1).map(s => ({ ...s, source: 'suggestion' }));

    await fetchAndPlay(song);
}

// ===== PLAY FROM QUEUE =====
async function playFromQueue(index) {
    const song = queue[index];
    if (!song) return;

    // Remove played song and everything before it from queue
    queue.splice(0, index + 1);

    await fetchAndPlay(song);
}

// ===== CORE: FETCH AND PLAY =====
async function fetchAndPlay(song) {
    // Add current song to history
    if (currentSongData) {
        history.push({
            ...currentSongData,
            source: 'history'
        });
        // Keep history reasonable
        if (history.length > 50) history.shift();
    }

    // Show player bar immediately
    document.getElementById('playerBar').classList.add('show');
    document.getElementById('pTitle').textContent = song.name || '—';
    document.getElementById('pArtist').textContent = getArtistText(song.artists);
    document.getElementById('pImg').src = getImageUrl(song.image, 'medium');

    // Reset suggestion preload flag
    suggestionsPreloaded = false;

    // Check if song already has download URLs (from suggestions)
    if (song.downloadUrl && song.downloadUrl.length > 0 && song.downloadUrl[0].link) {
        currentSongData = song;
        buildUrlMap(song);

        const streamUrl = getBestUrl();
        if (streamUrl) {
            updatePlayerUI(song, streamUrl);
            audio.src = streamUrl;
            audio.play();
            updatePlayBtn();
            trackPlayed(song.id);
            renderQueue();
            return;
        }
    }

    // Fetch full details
    try {
        const res = await fetch(`${API}/song?id=${song.id}`);
        const data = await res.json();

        if (!data.success || !data.data) {
            alert('Failed to load song');
            return;
        }

        currentSongData = data.data;
        buildUrlMap(data.data);

        const streamUrl = getBestUrl();
        if (!streamUrl) {
            alert('No stream URL available');
            return;
        }

        updatePlayerUI(data.data, streamUrl);
        audio.src = streamUrl;
        audio.play();
        updatePlayBtn();
        trackPlayed(data.data.id);
        renderQueue();

    } catch (e) {
        console.error(e);
        alert('Failed to load song');
    }
}

// ===== TRACK PLAYED SONGS =====
function trackPlayed(songId) {
    if (songId && !playedIds.includes(songId)) {
        playedIds.push(songId);
        // Keep last 30 for session suggestions
        if (playedIds.length > 30) playedIds.shift();
    }
}

// ===== SUGGESTIONS =====
async function loadSuggestions() {
    if (!currentSongData || suggestionsLoading) return;

    suggestionsLoading = true;
    const section = document.getElementById('suggestionsSection');
    const list = document.getElementById('suggestionsList');

    section.classList.add('show');
    list.innerHTML = '<div class="status"><span class="spinner"></span>Finding similar songs...</div>';

    try {
        // Send played IDs for session-based suggestions
        const idParam = playedIds.length > 0
            ? playedIds.slice(-5).join(',')
            : currentSongData.id;

        const res = await fetch(`${API}/suggest?id=${idParam}&limit=20`);
        const data = await res.json();

        if (data.success && data.results?.length > 0) {
            // Filter out songs already in queue or history
            const existingIds = new Set([
                ...queue.map(s => s.id),
                ...history.map(s => s.id),
                ...playedIds
            ]);

            suggestedSongs = data.results.filter(s => !existingIds.has(s.id));

            if (suggestedSongs.length > 0) {
                renderSuggestions();
            } else {
                list.innerHTML = '<div class="status">No new suggestions</div>';
            }
        } else {
            list.innerHTML = '<div class="status">No suggestions found</div>';
        }
    } catch (e) {
        console.error(e);
        list.innerHTML = '<div class="status">Failed to load suggestions</div>';
    }

    suggestionsLoading = false;
    suggestionsPreloaded = true;
}

function renderSuggestions() {
    const list = document.getElementById('suggestionsList');
    list.innerHTML = '';

    suggestedSongs.forEach((song, i) => {
        const el = createSongElement(song, i, 'sg', () => playSuggestion(i));
        list.appendChild(el);
    });
}

// ===== PRELOAD SUGGESTIONS WHEN SONG IS ABOUT TO END =====
audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;

    const pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById('seekFill').style.width = pct + '%';
    document.getElementById('curTime').textContent = formatTime(audio.currentTime);
    document.getElementById('durTime').textContent = formatTime(audio.duration);

    // When song is 75% done OR 30 seconds from end, preload suggestions
    const timeRemaining = audio.duration - audio.currentTime;
    const percentPlayed = (audio.currentTime / audio.duration) * 100;

    if (!suggestionsPreloaded && (percentPlayed >= 75 || timeRemaining <= 30)) {
        // Only load if queue is running low
        if (queue.length < 3) {
            loadSuggestions();
        } else {
            suggestionsPreloaded = true;
        }
    }
});

// ===== QUEUE MANAGEMENT =====
function addToQueue(song) {
    queue.push({ ...song, source: 'manual' });
    renderQueue();
}

function addAllSuggestionsToQueue() {
    suggestedSongs.forEach(song => {
        if (!queue.find(q => q.id === song.id)) {
            queue.push({ ...song, source: 'suggestion' });
        }
    });
    renderQueue();

    const btn = document.querySelector('.small-btn');
    btn.textContent = '✅ Added!';
    setTimeout(() => btn.textContent = '+ Add all to queue', 1500);
}

function removeFromQueue(index) {
    queue.splice(index, 1);
    renderQueue();
}

function clearQueue() {
    queue = [];
    renderQueue();
}

function shuffleQueue() {
    for (let i = queue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [queue[i], queue[j]] = [queue[j], queue[i]];
    }
    renderQueue();
}

function renderQueue() {
    const npSection = document.getElementById('queueNowPlaying');
    const nextSection = document.getElementById('queueNextUp');
    const histSection = document.getElementById('queueHistory');

    // Now Playing
    if (currentSongData) {
        npSection.innerHTML = `
            <div class="queue-section-title">Now Playing</div>
            <div class="queue-item active">
                <img src="${getImageUrl(currentSongData.image, 'low')}" alt="">
                <div class="qi-meta">
                    <div class="qi-name">${currentSongData.name || 'Unknown'}</div>
                    <div class="qi-artist">${getArtistText(currentSongData.artists)}</div>
                </div>
            </div>
        `;
    }

    // Next Up
    if (queue.length > 0) {
        let html = `<div class="queue-section-title">Next Up (${queue.length})</div>`;
        queue.forEach((song, i) => {
            html += `
                <div class="queue-item" onclick="playFromQueue(${i})">
                    <img src="${getImageUrl(song.image, 'low')}" alt="">
                    <div class="qi-meta">
                        <div class="qi-name">${song.name || 'Unknown'}</div>
                        <div class="qi-artist">${getArtistText(song.artists)}</div>
                    </div>
                    <button class="qi-remove" onclick="event.stopPropagation(); removeFromQueue(${i})">✕</button>
                </div>
            `;
        });
        nextSection.innerHTML = html;
    } else {
        nextSection.innerHTML = '<div class="queue-section-title">Next Up</div><div class="status" style="padding:1rem">Queue is empty. Suggestions will auto-play.</div>';
    }

    // History
    if (history.length > 0) {
        let html = `<div class="queue-section-title">Recently Played (${history.length})</div>`;
        const recentHistory = history.slice(-10).reverse();
        recentHistory.forEach((song, i) => {
            html += `
                <div class="queue-item" onclick="replayFromHistory(${history.length - 1 - i})">
                    <img src="${getImageUrl(song.image, 'low')}" alt="">
                    <div class="qi-meta">
                        <div class="qi-name">${song.name || 'Unknown'}</div>
                        <div class="qi-artist">${getArtistText(song.artists)}</div>
                    </div>
                </div>
            `;
        });
        histSection.innerHTML = html;
    } else {
        histSection.innerHTML = '';
    }
}

function replayFromHistory(index) {
    const song = history[index];
    if (song) fetchAndPlay(song);
}

function toggleQueue() {
    const panel = document.getElementById('queuePanel');
    panel.classList.toggle('show');
    if (panel.classList.contains('show')) renderQueue();
}

// ===== CONTROLS =====
function togglePlay() {
    if (audio.paused) audio.play();
    else audio.pause();
    updatePlayBtn();
}

function updatePlayBtn() {
    document.getElementById('playBtn').textContent = audio.paused ? '▶' : '⏸';
}

function nextSong() {
    if (queue.length > 0) {
        // Play from queue
        const next = shuffleMode
            ? queue.splice(Math.floor(Math.random() * queue.length), 1)[0]
            : queue.shift();
        fetchAndPlay(next);
    } else if (suggestedSongs.length > 0) {
        // Play from suggestions
        const next = suggestedSongs.shift();
        renderSuggestions();
        fetchAndPlay(next);
    }
    // If nothing left, suggestions will load via timeupdate
}

function prevSong() {
    if (audio.currentTime > 3) {
        audio.currentTime = 0;
    } else if (history.length > 0) {
        // Put current song back in front of queue
        if (currentSongData) {
            queue.unshift(currentSongData);
        }
        const prev = history.pop();
        // Don't add to history again
        currentSongData = null;
        fetchAndPlay(prev);
    }
}

// ===== REPEAT & SHUFFLE =====
function toggleRepeat() {
    const btn = document.getElementById('repeatBtn');
    if (repeatMode === 'none') {
        repeatMode = 'all';
        btn.textContent = '🔁';
        btn.classList.add('active-mode');
    } else if (repeatMode === 'all') {
        repeatMode = 'one';
        btn.textContent = '🔂';
        btn.classList.add('active-mode');
    } else {
        repeatMode = 'none';
        btn.textContent = '🔁';
        btn.classList.remove('active-mode');
    }
}

function toggleShuffle() {
    shuffleMode = !shuffleMode;
    document.getElementById('shuffleBtn').classList.toggle('active-mode', shuffleMode);
}

// ===== SONG ENDED =====
audio.addEventListener('ended', () => {
    if (repeatMode === 'one') {
        audio.currentTime = 0;
        audio.play();
        return;
    }

    if (repeatMode === 'all' && queue.length === 0 && history.length > 0) {
        // Refill queue from history
        queue = [...history];
        history = [];
    }

    nextSong();
});

audio.addEventListener('play', updatePlayBtn);
audio.addEventListener('pause', updatePlayBtn);

// ===== SEEK =====
document.getElementById('seekBar').addEventListener('click', e => {
    const rect = e.currentTarget.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    if (audio.duration) audio.currentTime = pct * audio.duration;
});

// ===== QUALITY =====
document.querySelectorAll('.q-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentQuality = btn.dataset.q;

        const url = currentUrls[currentQuality];
        if (url) {
            const time = audio.currentTime;
            const playing = !audio.paused;
            audio.src = url;
            audio.currentTime = time;
            if (playing) audio.play();
            document.getElementById('dlLink').href = url;
        }
    });
});

// ===== LYRICS =====
async function openLyrics() {
    if (!currentSongData) return;
    const modal = document.getElementById('lyricsModal');
    document.getElementById('lyricTitle').textContent = currentSongData.name;
    document.getElementById('lyricArtist').textContent = getArtistText(currentSongData.artists);
    document.getElementById('lyricText').textContent = 'Loading...';
    modal.classList.add('show');

    try {
        const res = await fetch(`${API}/lyrics?id=${currentSongData.id}`);
        const data = await res.json();
        document.getElementById('lyricText').textContent = data.success ? data.data.lyrics : 'Lyrics not available.';
    } catch { document.getElementById('lyricText').textContent = 'Failed to load lyrics.'; }
}

function closeLyrics() { document.getElementById('lyricsModal').classList.remove('show'); }

// ===== COPY =====
function copyUrl() {
    const url = currentUrls[currentQuality] || audio.src;
    if (!url) return;
    navigator.clipboard.writeText(url).then(() => {
        const el = document.querySelector('.action-link[onclick="copyUrl()"]');
        el.textContent = '✅';
        setTimeout(() => el.textContent = '📋 Copy', 1500);
    });
}

// ===== HELPERS =====
function buildUrlMap(data) {
    currentUrls = {};
    if (data.downloadUrl?.length > 0) {
        data.downloadUrl.forEach(item => { currentUrls[item.quality] = item.link; });
    }
}

function getBestUrl() {
    return currentUrls[currentQuality] || currentUrls['320kbps'] || currentUrls['160kbps']
        || currentUrls['96kbps'] || currentUrls['48kbps'] || currentUrls['12kbps'] || null;
}

function getArtistText(artists) {
    if (!artists) return 'Unknown';
    if (typeof artists === 'string') return artists;
    return artists.primary || artists.all || 'Unknown';
}

function getImageUrl(image, size) {
    if (!image) return '';
    if (typeof image === 'string') {
        return size === 'medium' ? image.replace('150x150', '500x500') : image;
    }
    return image[size] || image.low || image.medium || '';
}

function formatTime(s) {
    s = Math.floor(s);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function updatePlayerUI(data, streamUrl) {
    document.getElementById('pTitle').textContent = data.name || '—';
    document.getElementById('pArtist').textContent = getArtistText(data.artists);
    document.getElementById('pImg').src = getImageUrl(data.image, 'medium');
    document.getElementById('lyricsLink').style.display = data.hasLyrics ? 'inline' : 'none';
    document.getElementById('dlLink').href = streamUrl || '#';
}

// ===== KEYBOARD =====
document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    switch (e.code) {
        case 'Space': e.preventDefault(); togglePlay(); break;
        case 'ArrowRight': audio.currentTime = Math.min(audio.currentTime + 5, audio.duration || 0); break;
        case 'ArrowLeft': audio.currentTime = Math.max(audio.currentTime - 5, 0); break;
        case 'KeyN': nextSong(); break;
        case 'KeyP': prevSong(); break;
        case 'KeyQ': toggleQueue(); break;
        case 'KeyL': if (currentSongData?.hasLyrics) openLyrics(); break;
        case 'KeyS': toggleShuffle(); break;
        case 'KeyR': toggleRepeat(); break;
        case 'Escape': closeLyrics(); document.getElementById('queuePanel').classList.remove('show'); break;
    }
});

// ===== MEDIA SESSION =====
audio.addEventListener('play', () => {
    if (!currentSongData || !('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
        title: currentSongData.name || '',
        artist: getArtistText(currentSongData.artists),
        album: currentSongData.album || '',
        artwork: [{ src: getImageUrl(currentSongData.image, 'medium'), sizes: '500x500', type: 'image/jpeg' }]
    });
    navigator.mediaSession.setActionHandler('play', () => audio.play());
    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    navigator.mediaSession.setActionHandler('previoustrack', prevSong);
    navigator.mediaSession.setActionHandler('nexttrack', nextSong);
});

// ===== TRENDING =====
async function loadTrending() {
    const content = document.getElementById('content');
    content.innerHTML = '<div class="status"><span class="spinner"></span>Loading trending...</div>';
    try {
        const res = await fetch(`${API}/trending?language=hindi`);
        const data = await res.json();
        if (data.success && data.results?.length > 0) {
            songs = data.results;
            content.innerHTML = '<div class="section-title">🔥 Trending Now</div><div class="song-list" id="songList"></div>';
            renderSongs();
        } else {
            content.innerHTML = '<div class="status">Search for a song to get started</div>';
        }
    } catch {
        content.innerHTML = '<div class="status">Search for a song to get started</div>';
    }
}

loadTrending();
</script>
