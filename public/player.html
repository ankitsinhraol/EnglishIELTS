<!DOCTYPE html>
<html>
<head>
    <title>JioSaavn Player</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg: #0a0a0a;
            --card: #141414;
            --card-hover: #1a1a1a;
            --border: #222;
            --text: #fff;
            --text-dim: #888;
            --text-dimmer: #555;
            --accent: #1db954;
            --accent-hover: #1ed760;
        }
        * {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .app {
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem;
            padding-bottom: 220px;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            padding: 1.5rem 0;
        }
        .logo {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), #15e065);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .tagline {
            color: var(--text-dimmer);
            font-size: 13px;
            margin-top: 4px;
        }

        /* ===== SEARCH ===== */
        .search-wrapper {
            position: sticky;
            top: 0;
            background: var(--bg);
            padding: 12px 0;
            z-index: 100;
        }
        .search-bar {
            display: flex;
            gap: 10px;
        }
        .search-bar input {
            flex: 1;
            padding: 14px 20px;
            font-size: 16px;
            border: 2px solid var(--border);
            border-radius: 50px;
            background: var(--card);
            color: var(--text);
            outline: none;
            transition: border-color 0.3s;
        }
        .search-bar input:focus {
            border-color: var(--accent);
        }
        .search-bar input::placeholder {
            color: var(--text-dimmer);
        }

        /* ===== TABS ===== */
        .tabs {
            display: flex;
            gap: 8px;
            margin: 1rem 0;
            overflow-x: auto;
        }
        .tab {
            padding: 8px 18px;
            font-size: 14px;
            border: none;
            border-radius: 50px;
            background: var(--card);
            color: var(--text-dim);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .tab:hover { background: var(--card-hover); }
        .tab.active {
            background: var(--accent);
            color: #000;
            font-weight: 600;
        }

        /* ===== SONG LIST ===== */
        .song-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .song-item {
            display: flex;
            gap: 14px;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            align-items: center;
            transition: background 0.2s;
            position: relative;
        }
        .song-item:hover {
            background: var(--card-hover);
        }
        .song-item.active {
            background: var(--card);
        }
        .song-item.loading::after {
            content: '';
            position: absolute;
            right: 14px;
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        .song-num {
            width: 24px;
            text-align: center;
            color: var(--text-dimmer);
            font-size: 14px;
            flex-shrink: 0;
        }
        .song-item:hover .song-num { color: var(--accent); }
        .song-item.active .song-num { color: var(--accent); }
        .song-thumb {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .song-meta {
            flex: 1;
            min-width: 0;
        }
        .song-name {
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .song-item.active .song-name { color: var(--accent); }
        .song-artists {
            color: var(--text-dim);
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        .song-album {
            color: var(--text-dimmer);
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: none;
        }
        @media (min-width: 600px) {
            .song-album { display: block; min-width: 120px; max-width: 180px; }
        }
        .song-dur {
            color: var(--text-dimmer);
            font-size: 13px;
            flex-shrink: 0;
            min-width: 40px;
            text-align: right;
        }

        /* ===== PLAYER BAR ===== */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #181818;
            border-top: 1px solid #282828;
            z-index: 1000;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        .player-bar.show {
            transform: translateY(0);
        }
        .player-wrapper {
            max-width: 800px;
            margin: 0 auto;
            padding: 10px 1rem 8px;
        }

        /* Player Top Row */
        .player-top {
            display: flex;
            gap: 14px;
            align-items: center;
            margin-bottom: 8px;
        }
        .player-img {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            object-fit: cover;
        }
        .player-meta {
            flex: 1;
            min-width: 0;
        }
        .player-title {
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-artist {
            color: var(--text-dim);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        /* Controls */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 6px;
        }
        .ctrl-btn {
            background: none;
            border: none;
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: all 0.2s;
            opacity: 0.8;
        }
        .ctrl-btn:hover { opacity: 1; }
        .ctrl-btn.main {
            background: var(--accent);
            color: #000;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            opacity: 1;
        }
        .ctrl-btn.main:hover { background: var(--accent-hover); transform: scale(1.05); }

        /* Progress */
        .progress-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .time-label {
            font-size: 11px;
            color: var(--text-dimmer);
            min-width: 38px;
            font-variant-numeric: tabular-nums;
        }
        .time-label:last-child { text-align: right; }
        .seek-bar {
            flex: 1;
            height: 4px;
            background: #333;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            transition: height 0.1s;
        }
        .seek-bar:hover { height: 6px; }
        .seek-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            width: 0%;
            pointer-events: none;
        }
        .seek-bar:hover .seek-fill { background: var(--accent-hover); }

        /* Quality Row */
        .quality-row {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .q-btn {
            padding: 3px 10px;
            font-size: 11px;
            border: 1px solid #333;
            border-radius: 50px;
            background: transparent;
            color: var(--text-dimmer);
            cursor: pointer;
            transition: all 0.2s;
        }
        .q-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
            font-weight: 600;
        }
        .q-btn:hover { border-color: var(--accent); color: var(--accent); }
        .q-btn.active:hover { color: #000; }
        .action-link {
            padding: 3px 10px;
            font-size: 11px;
            border: 1px solid #333;
            border-radius: 50px;
            color: var(--text-dimmer);
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .action-link:hover { border-color: var(--accent); color: var(--accent); }

        /* ===== LYRICS MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 2000;
            overflow-y: auto;
            padding: 2rem 1rem;
        }
        .modal-overlay.show { display: block; }
        .modal-box {
            max-width: 550px;
            margin: 0 auto;
            text-align: center;
        }
        .modal-box h2 {
            color: var(--accent);
            margin-bottom: 0.5rem;
        }
        .modal-box .sub {
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 1.5rem;
        }
        .modal-lyrics {
            white-space: pre-wrap;
            line-height: 2;
            font-size: 16px;
            color: #ccc;
        }
        .modal-close {
            position: fixed;
            top: 1rem;
            right: 1rem;
            font-size: 22px;
            background: #333;
            border: none;
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
        }

        /* ===== STATUS ===== */
        .status {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-dimmer);
        }
        .status.error { color: #ff4444; }

        /* ===== ANIMATIONS ===== */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #333;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        /* ===== SECTION ===== */
        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin: 1.5rem 0 1rem;
        }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <div class="logo">🎵 JioSaavn Player</div>
        <div class="tagline">Self-hosted streaming • No third party APIs</div>
    </div>

    <div class="search-wrapper">
        <div class="search-bar">
            <input type="search" id="searchInput" placeholder="What do you want to listen to?">
        </div>
    </div>

    <div class="tabs" id="tabs">
        <button class="tab active" data-lang="">All</button>
        <button class="tab" data-lang="hindi">Hindi</button>
        <button class="tab" data-lang="english">English</button>
        <button class="tab" data-lang="punjabi">Punjabi</button>
        <button class="tab" data-lang="tamil">Tamil</button>
        <button class="tab" data-lang="telugu">Telugu</button>
    </div>

    <div id="content">
        <div class="status">Search for a song to get started</div>
    </div>
</div>

<!-- Player Bar -->
<div class="player-bar" id="playerBar">
    <div class="player-wrapper">
        <div class="player-top">
            <img class="player-img" id="pImg" src="" alt="">
            <div class="player-meta">
                <div class="player-title" id="pTitle">—</div>
                <div class="player-artist" id="pArtist">—</div>
            </div>
        </div>
        <div class="controls">
            <button class="ctrl-btn" onclick="prevSong()">⏮</button>
            <button class="ctrl-btn main" id="playBtn" onclick="togglePlay()">▶</button>
            <button class="ctrl-btn" onclick="nextSong()">⏭</button>
        </div>
        <div class="progress-row">
            <span class="time-label" id="curTime">0:00</span>
            <div class="seek-bar" id="seekBar">
                <div class="seek-fill" id="seekFill"></div>
            </div>
            <span class="time-label" id="durTime">0:00</span>
        </div>
        <div class="quality-row">
            <button class="q-btn" data-q="48kbps">48k</button>
            <button class="q-btn" data-q="96kbps">96k</button>
            <button class="q-btn" data-q="160kbps">160k</button>
            <button class="q-btn active" data-q="320kbps">320k</button>
            <span class="action-link" id="lyricsLink" onclick="openLyrics()" style="display:none">📝 Lyrics</span>
            <span class="action-link" onclick="copyUrl()">📋 Copy URL</span>
            <a class="action-link" id="dlLink" href="#" download>⬇ Download</a>
        </div>
    </div>
</div>

<!-- Lyrics Modal -->
<div class="modal-overlay" id="lyricsModal">
    <button class="modal-close" onclick="closeLyrics()">✕</button>
    <div class="modal-box">
        <h2 id="lyricTitle"></h2>
        <p class="sub" id="lyricArtist"></p>
        <div class="modal-lyrics" id="lyricText"></div>
    </div>
</div>

<!-- Audio -->
<audio id="audio"></audio>

<script>
// ===== CONFIG =====
const API = window.location.origin + '/api';
const audio = document.getElementById('audio');

// ===== STATE =====
let songs = [];
let currentIndex = -1;
let currentQuality = '320kbps';
let currentUrls = {};
let currentSongData = null;
let selectedLang = '';

// ===== SEARCH =====
const searchInput = document.getElementById('searchInput');
let searchTimer;

searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => doSearch(), 350);
});
searchInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { clearTimeout(searchTimer); doSearch(); }
});

// Language tabs
document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        selectedLang = tab.dataset.lang;
        if (searchInput.value.trim()) doSearch();
    });
});

async function doSearch() {
    const q = searchInput.value.trim();
    if (!q) return;

    const content = document.getElementById('content');
    content.innerHTML = '<div class="status"><span class="spinner"></span>Searching...</div>';

    try {
        let url = `${API}/search?q=${encodeURIComponent(q)}&limit=30`;
        const res = await fetch(url);
        const data = await res.json();

        if (!data.success || !data.results?.length) {
            content.innerHTML = '<div class="status">No results found</div>';
            return;
        }

        // Filter by language if selected
        let results = data.results;
        if (selectedLang) {
            const filtered = results.filter(s => s.language === selectedLang);
            if (filtered.length > 0) results = filtered;
        }

        songs = results;
        renderSongs();

    } catch (e) {
        console.error(e);
        content.innerHTML = '<div class="status error">Search failed. Try again.</div>';
    }
}

function renderSongs() {
    const content = document.getElementById('content');
    content.innerHTML = `<div class="section-title">Results</div><div class="song-list" id="songList"></div>`;
    const list = document.getElementById('songList');

    songs.forEach((song, i) => {
        const el = document.createElement('div');
        el.className = 'song-item' + (i === currentIndex ? ' active' : '');
        el.id = `s-${i}`;

        const dur = formatTime(song.duration || 0);

        el.innerHTML = `
            <div class="song-num">${i === currentIndex ? '🔊' : i + 1}</div>
            <img class="song-thumb" src="${song.image?.replace('150x150','150x150') || ''}" alt="" loading="lazy">
            <div class="song-meta">
                <div class="song-name">${song.name || 'Unknown'}</div>
                <div class="song-artists">${song.artists || 'Unknown'}</div>
            </div>
            <div class="song-album">${song.album || ''}</div>
            <div class="song-dur">${dur}</div>
        `;

        el.addEventListener('click', () => handleSongClick(i));
        list.appendChild(el);
    });
}

// ===== PLAY SONG (on click, fetch full details) =====
async function handleSongClick(index) {
    const song = songs[index];
    if (!song) return;

    // If same song clicked, just toggle play/pause
    if (index === currentIndex && audio.src) {
        togglePlay();
        return;
    }

    currentIndex = index;

    // Update UI immediately
    highlightActive();
    showPlayerBar(song);

    // Show loading state
    const el = document.getElementById(`s-${index}`);
    if (el) el.classList.add('loading');

    try {
        const res = await fetch(`${API}/song?id=${song.id}`);
        const data = await res.json();

        if (el) el.classList.remove('loading');

        if (!data.success || !data.data) {
            alert('Failed to load song');
            return;
        }

        currentSongData = data.data;

        // Build URL map from new response format
        currentUrls = {};
        if (data.data.downloadUrl && data.data.downloadUrl.length > 0) {
            data.data.downloadUrl.forEach(item => {
                currentUrls[item.quality] = item.url;
            });
        }

        // Find best available stream URL
        const streamUrl = currentUrls[currentQuality]
            || currentUrls['320kbps']
            || currentUrls['160kbps']
            || currentUrls['96kbps']
            || currentUrls['48kbps']
            || currentUrls['preview']
            || null;

        if (!streamUrl) {
            alert('No stream URL available for this song');
            return;
        }

        // Update player with full data
        // Handle new artists format (object with primary, featured, music)
        const artistText = typeof data.data.artists === 'object'
            ? data.data.artists.primary
            : data.data.artists;

        document.getElementById('pTitle').textContent = data.data.name || '—';
        document.getElementById('pArtist').textContent = artistText || '—';
        document.getElementById('pImg').src = data.data.image?.medium || data.data.image?.low || '';
        document.getElementById('lyricsLink').style.display = data.data.hasLyrics ? 'inline' : 'none';
        document.getElementById('dlLink').href = streamUrl;

        // Play
        audio.src = streamUrl;
        audio.play();
        updatePlayBtn();

    } catch (e) {
        if (el) el.classList.remove('loading');
        console.error(e);
        alert('Failed to load song. Try again.');
    }
}
// ===== PLAYER UI =====
function showPlayerBar(song) {
    const bar = document.getElementById('playerBar');
    bar.classList.add('show');
    document.getElementById('pTitle').textContent = song.name || '—';
    document.getElementById('pArtist').textContent = song.artists || '—';
    document.getElementById('pImg').src = song.image?.replace('150x150', '500x500') || '';
}

function updatePlayerUI(data) {
    document.getElementById('pTitle').textContent = data.name || '—';
    document.getElementById('pArtist').textContent = data.artists || '—';
    document.getElementById('pImg').src = data.image?.medium || data.image?.low || '';
    document.getElementById('lyricsLink').style.display = data.hasLyrics ? 'inline' : 'none';

    const url = currentUrls[currentQuality] || '';
    document.getElementById('dlLink').href = url;
}

function highlightActive() {
    document.querySelectorAll('.song-item').forEach((el, i) => {
        el.classList.toggle('active', i === currentIndex);
        const num = el.querySelector('.song-num');
        if (num) num.textContent = i === currentIndex ? '🔊' : i + 1;
    });
}

// ===== AUDIO CONTROLS =====
function togglePlay() {
    if (audio.paused) audio.play();
    else audio.pause();
    updatePlayBtn();
}

function updatePlayBtn() {
    document.getElementById('playBtn').textContent = audio.paused ? '▶' : '⏸';
}

function nextSong() {
    if (currentIndex < songs.length - 1) handleSongClick(currentIndex + 1);
}

function prevSong() {
    if (audio.currentTime > 3) {
        audio.currentTime = 0;
    } else if (currentIndex > 0) {
        handleSongClick(currentIndex - 1);
    }
}

// Also update the Media Session handler
audio.addEventListener('play', () => {
    if (!currentSongData || !('mediaSession' in navigator)) return;

    const artistText = typeof currentSongData.artists === 'object'
        ? currentSongData.artists.primary
        : currentSongData.artists;

    navigator.mediaSession.metadata = new MediaMetadata({
        title: currentSongData.name,
        artist: artistText,
        album: currentSongData.album || '',
        artwork: [
            { src: currentSongData.image?.medium || '', sizes: '500x500', type: 'image/jpeg' }
        ]
    });
    navigator.mediaSession.setActionHandler('play', () => audio.play());
    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    navigator.mediaSession.setActionHandler('previoustrack', prevSong);
    navigator.mediaSession.setActionHandler('nexttrack', nextSong);
});
audio.addEventListener('pause', updatePlayBtn);
audio.addEventListener('ended', nextSong);

// ===== PROGRESS BAR =====
audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById('seekFill').style.width = pct + '%';
    document.getElementById('curTime').textContent = formatTime(audio.currentTime);
    document.getElementById('durTime').textContent = formatTime(audio.duration);
});

document.getElementById('seekBar').addEventListener('click', e => {
    const rect = e.currentTarget.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    if (audio.duration) audio.currentTime = pct * audio.duration;
});

// ===== QUALITY SWITCH =====
document.querySelectorAll('.q-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentQuality = btn.dataset.q;

        const url = currentUrls[currentQuality];
        if (url) {
            const time = audio.currentTime;
            const playing = !audio.paused;
            audio.src = url;
            audio.currentTime = time;
            if (playing) audio.play();
            document.getElementById('dlLink').href = url;
        }
    });
});

// ===== LYRICS =====
async function openLyrics() {
    if (!currentSongData) return;

    const modal = document.getElementById('lyricsModal');
    document.getElementById('lyricTitle').textContent = currentSongData.name;
    document.getElementById('lyricArtist').textContent = currentSongData.artists;
    document.getElementById('lyricText').textContent = 'Loading...';
    modal.classList.add('show');

    try {
        const res = await fetch(`${API}/lyrics?id=${currentSongData.id}`);
        const data = await res.json();
        document.getElementById('lyricText').textContent = data.success
            ? data.data.lyrics
            : 'Lyrics not available';
    } catch {
        document.getElementById('lyricText').textContent = 'Failed to load lyrics';
    }
}

function closeLyrics() {
    document.getElementById('lyricsModal').classList.remove('show');
}

// ===== COPY URL =====
function copyUrl() {
    const url = currentUrls[currentQuality] || audio.src;
    if (!url) return;
    navigator.clipboard.writeText(url).then(() => {
        const el = document.querySelector('.action-link[onclick="copyUrl()"]');
        el.textContent = '✅ Copied!';
        setTimeout(() => el.textContent = '📋 Copy URL', 1500);
    });
}

// ===== KEYBOARD SHORTCUTS =====
document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    switch (e.code) {
        case 'Space': e.preventDefault(); togglePlay(); break;
        case 'ArrowRight': audio.currentTime = Math.min(audio.currentTime + 5, audio.duration); break;
        case 'ArrowLeft': audio.currentTime = Math.max(audio.currentTime - 5, 0); break;
        case 'KeyN': nextSong(); break;
        case 'KeyP': prevSong(); break;
        case 'KeyL': if (currentSongData?.hasLyrics) openLyrics(); break;
        case 'Escape': closeLyrics(); break;
    }
});

// ===== HELPERS =====
function formatTime(s) {
    s = Math.floor(s);
    const m = Math.floor(s / 60);
    return m + ':' + String(s % 60).padStart(2, '0');
}

// ===== MEDIA SESSION API (Lock screen controls) =====
audio.addEventListener('play', () => {
    if (!currentSongData || !('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
        title: currentSongData.name,
        artist: currentSongData.artists,
        album: currentSongData.album || '',
        artwork: [
            { src: currentSongData.image?.medium || '', sizes: '500x500', type: 'image/jpeg' }
        ]
    });
    navigator.mediaSession.setActionHandler('play', () => audio.play());
    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    navigator.mediaSession.setActionHandler('previoustrack', prevSong);
    navigator.mediaSession.setActionHandler('nexttrack', nextSong);
});

// ===== LOAD TRENDING ON START =====
async function loadTrending() {
    const content = document.getElementById('content');
    content.innerHTML = '<div class="status"><span class="spinner"></span>Loading trending...</div>';

    try {
        const res = await fetch(`${API}/trending?language=hindi`);
        const data = await res.json();

        if (data.success && data.results?.length > 0) {
            songs = data.results;
            content.innerHTML = `<div class="section-title">🔥 Trending Now</div><div class="song-list" id="songList"></div>`;
            renderSongs();
        } else {
            content.innerHTML = '<div class="status">Search for a song to get started</div>';
        }
    } catch {
        content.innerHTML = '<div class="status">Search for a song to get started</div>';
    }
}

loadTrending();
</script>
